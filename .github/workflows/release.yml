name: Build and Release VOX Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version (e.g. v2.1.0)"
        required: true
        default: "v2.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install clean production & build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt pyinstaller pefile

      - name: Build production desktop & Windows installer
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python scripts/build_v21_release.py --skip-docs-sync

      - name: Verify built binaries & trust chain
        shell: pwsh
        run: |
          .\dist\VoxLocal\VoxLocal.exe --verify-runtime
          .\dist\VoxLocal\VoxLocal.exe --hardware-diagnostics
          .\dist\VoxLocal\VoxLocal.exe --health-check
          .\dist\VoxLocal\VoxLocal.exe --smoke-test-ms 3000
          .\release_artifacts\VoxLocal-Setup.exe --smoke-test

      - name: Publish Release Artifacts to GitHub Releases
        uses: softprops/action-github-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          name: VOX ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          generate_release_notes: true
          files: |
            release_artifacts/VoxLocal-Setup.exe
            release_artifacts/SHA256SUMS.txt
            release_artifacts/release_manifest_*.json
            release_artifacts/RELEASE_NOTES_*.md
