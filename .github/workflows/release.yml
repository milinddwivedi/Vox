name: Build and Release VOX Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag version (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone app bundle with PyInstaller
        run: |
          pyinstaller VoxLocal.spec --noconfirm

      - name: Verify headless GUI startup smoke test
        run: |
          .\dist\VoxLocal\VoxLocal.exe --smoke-test-ms 3000

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_artifacts | Out-Null
          Compress-Archive -Path .\dist\VoxLocal\* -DestinationPath .\release_artifacts\VoxLocal-Portable-win64.zip -Force

      - name: Build Windows Installer (VoxLocal-Setup.exe) with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if (-not $ver -or $ver -eq "main") { $ver = "${{ github.event.inputs.version }}".TrimStart("v") }
          if (-not $ver) { $ver = "1.0.0" }
          & $iscc "/DMyAppVersion=$ver" .\packaging\VoxLocal.iss

      - name: Publish Release Artifacts to GitHub Releases
        uses: softprops/action-github-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          name: VOX ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          generate_release_notes: true
          files: |
            release_artifacts/VoxLocal-Setup.exe
            release_artifacts/VoxLocal-Portable-win64.zip
