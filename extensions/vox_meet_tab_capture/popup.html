<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h3 {
      margin: 0 0 6px 0;
      font-size: 15px;
      color: #60a5fa;
    }
    p {
      margin: 0 0 12px 0;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .status {
      padding: 8px 10px;
      border-radius: 8px;
      background: #1e293b;
      font-size: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    button {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 6px;
    }
    #btnLock {
      background: #2563eb;
      color: white;
    }
    #btnUnlock {
      background: #334155;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <h3>VOX Call-Only Meet Lock</h3>
  <p>Locks VOX strictly to this Google Meet tab so switching browser tabs never records other pages.</p>
  <div id="statusBox" class="status">Checking status...</div>
  <button id="btnLock">Lock This Google Meet Tab</button>
  <button id="btnUnlock">Release Tab Lock</button>
  <script src="popup.js"></script>
</body>
</html>
